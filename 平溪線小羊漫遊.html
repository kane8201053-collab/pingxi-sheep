        if(m.k==='hi'){if(last)send('s',last);return;}
        if(m.k!=='s'||!m.p||typeof m.p!=='object')return;
        const q=+m.q;const p=peers.get(m.id);if(p&&!(q>p.q))return;if(!p&&peers.size>=40)return;
        peers.set(m.id,{id:m.id,q,seen:Date.now(),pr:m.p});emit();});
      send('hi');
      const hb=setInterval(()=>{if(!live)return;if(last)send('s',last);const now=Date.now();let ch=false;for(const [id,p] of peers)if(now-p.seen>15000){peers.delete(id);ch=true;}if(ch)emit();},2500);
      return {presence(p){last=p;return send('s',p);},
        onPeers(cb){peerCbs.add(cb);Promise.resolve().then(()=>cb({peers:list()}));return ()=>peerCbs.delete(cb);},
        onConnection,
        async leave(){if(!live)return;try{await send('bye');}catch(e){}live=false;clearInterval(hb);unsub(topic);peers.clear();}};
    }};
}
function claudeTransport(ns){
  return {kind:'claude',rate:.12,
    onConnection(cb){try{return ns.onConnection(cb);}catch(e){return ()=>{};}},
    watchLobby(cb,onOnline){try{ns.onPeers(ch=>{const m=new Map();for(const p of ch.peers){const pr=p.presence||{};const c=typeof pr.rm==='string'?mpNormCode(pr.rm):'';if(c.length===6)m.set(c,Math.max(m.get(c)||0,clamp(Math.floor(+pr.rn)||1,1,64)));}

    advertise(code,n){try{ns.presence({rm:code,rn:n}).catch(()=>{});}catch(e){}},
    unadvertise(){try{ns.presence({rm:null,rn:null}).catch(()=>{});}catch(e){}},
    async join(code,pw){return ns.join(await mpRoomName(code,pw));}};
}
async function mpInit(){

function raceUpdate(dt){

    const k=offer?offer.id:'';if(k!==(RACE.offer?RACE.offer.id:'')){RACE.offer=offer;raceRender();}}
  else if(RACE.phase==='idle'&&RACE.offer){RACE.offer=null;raceRender();}
  if(RACE.phase==='idle')return;
  const cps=raceCPs();
  if(!RACE.host&&!RACE.solo){const hp=MP.peers.get(RACE.hostPeer);const hr=hp&&hp.ra;

  }

        if(RACE.solo){const b=store.get('raceBest',0);if(!b||RACE.fin<b){store.set('raceBest',RACE.fin);RACE.best=true;}else RACE.best=false;}
        toast(t('race_fin',{t:fmtRace(RACE.fin)}),3200);muChime();}

    const nc=cps[Math.min(RACE.cp,cps.length-1)];const a=RACE.arrow;if(a&&RACE.phase==='run'){a.position.set(SHEEP.x,SHEEP.y+2.25+Math.sin(TT*5)*.08,SHEEP.z);a.rotation.y=Math.atan2(nc.x-SHEEP.x,nc.z-SHEEP.z);}}
  if(RACE.phase==='done'&&!RACE.solo){RACE.endT+=dt;
    if(!RACE.host){const hp=MP.peers.get(RACE.hostPeer);const hr=hp&&hp.ra;if(hr&&hr.i!==RACE.id&&hr.p==='l'&&!RACE.skip.has(hr.i)){const off={id:hr.i,peer:hp.id,name:hp.name};raceReset();RACE.offer=off;raceRender();return;}}}
  for(const m of RACE.marks){m.ring.rotation.z+=dt*.6;}
  RACE.hudT=(RACE.hudT||0)-dt;if(RACE.hudT<=0){RACE.hudT=.2;raceRender();}
}
function raceRender(){
  const el=$('race');let html='';const cps=raceCPs();
  if(RACE.phase==='idle'){
    if(RACE.offer){html=`<p class="eyebrow">${esc(t('race_eyebrow'))}</p><h3>${esc(t('race_invite',{n:RACE.offer.name}))}</h3><p>${esc(t('race_desc'))}</p>
      <div class="row"><button class="btn accent" type="button" data-race="join">${esc(t('race_join'))}</button><button class="btn ghost" type="button" data-race="skip">${esc(t('race_skip'))}</button></div>`;}
  }else if(RACE.phase==='lobby'){
    const m=raceMembers();const ready=m.filter(x=>x.ready).length;
    const rows=m.map(x=>`<li><i style="background:${(SCARVES[x.scarf]||SCARVES.red).c}"></i><span>${esc(x.name)}</span><small>${x.me?esc(t('mp_you')):''}</small><b class="${x.ready?'ok':''}">${x.ready?'✓':'…'}</b></li>`).join('');
    const btns=RACE.host?`<button class="btn accent${!RACE.solo&&ready<m.length?' wait':''}" type="button" data-race="go">${esc(t(RACE.solo?'race_start_solo':'race_start'))}</button>`:`<button class="btn ${RACE.ready?'ghost':'accent'}" type="button" data-race="ready">${esc(t(RACE.ready?'race_unready':'race_ready'))}</button>`;
    const best=RACE.solo?store.get('raceBest',0):0;
    html=`<p class="eyebrow">${esc(t('race_eyebrow'))}</p><h3>${esc(t(RACE.solo?'race_solo_h':'race_lobby_h'))}</h3><p>${esc(t('race_desc'))}</p>
      ${RACE.solo?(best?`<p class="race-meta">${esc(t('race_best',{t:fmtRace(best)}))}</p>`:''):`<ul class="race-list">${rows}</ul><p class="race-meta">${esc(RACE.host?t('race_wait',{r:ready,n:m.length}):t('race_waithost'))}</p>`}
      <div class="row">${btns}<button class="btn ghost" type="button" data-race="quit">${esc(t('race_quit'))}</button></div>`;
  }else if(RACE.phase==='count'||RACE.phase==='run'){
    const r=raceRanked();const me=r.findIndex(x=>x.me)+1;const el2=RACE.phase==='run'?performance.now()-RACE.t0:0;
    const next=RACE.cp<cps.length?t(RACE_CP_KEYS[RACE.cp]):'';
    html=`<div class="race-run"><span class="race-time mono">${fmtRace(el2)}</span><span class="race-next"><b>${Math.min(RACE.cp+1,cps.length)}/${cps.length}</b> ${esc(next)}</span>${r.length>1?`<span class="race-rank">${esc(t('race_rank',{r:me,n:r.length}))}</span>`:''}<button class="icon-btn sm" type="button" data-race="quit" aria-label="${esc(t('race_quit'))}">✕</button></div>`;
  }else if(RACE.phase==='done'){
    const r=raceRanked();const all=r.every(x=>x.f>0);
    const rows=r.map((x,i)=>`<li${x.me?' class="me"':''}><b class="pos">${i+1}</b><i style="background:${(SCARVES[x.scarf]||SCARVES.red).c}"></i><span>${esc(x.name)}</span><b class="mono">${x.f?fmtRace(x.f):esc(t('race_running'))}</b></li>`).join('');
    const best=RACE.solo?store.get('raceBest',0):0;
    html=`<p class="eyebrow">${esc(t('race_eyebrow'))}</p><h3>${esc(t(all||RACE.solo?'race_results':'race_results_live'))}</h3><ol class="race-list res">${rows}</ol>
      ${RACE.solo&&best?`<p class="race-meta">${esc(RACE.best?t('race_newbest'):t('race_best',{t:fmtRace(best)}))}</p>`:''}
      <div class="row">${RACE.host?`<button class="btn accent" type="button" data-race="again">${esc(t('race_again'))}</button>`:''}<button class="btn ghost" type="button" data-race="quit">${esc(t('race_close'))}</button></div>`;
  }
  if(html===RACE.sig)return;RACE.sig=html;
  el.hidden=!html;el.className='race-card'+(RACE.phase==='count'||RACE.phase==='run'?' slim':'');el.innerHTML=html;if(document.body)document.body.classList.toggle('racing',RACE.phase!=='idle');
}
$('race').addEventListener('click',e=>{const b=e.target.closest('[data-race]');if(!b)return;const a=b.dataset.race;
  if(a==='join')raceJoin();else if(a==='skip'){if(RACE.offer)RACE.skip.add(RACE.offer.id);RACE.offer=null;raceRender();}
  else if(a==='ready'){if(!RACE.ready&&STA.n<GAME_COST){toast(t('sta_race',{c:GAME_COST,n:STA.n}),3600);return;}RACE.ready=!RACE.ready;raceRender();mpSend(true);}
  else if(a==='go')raceGo();else if(a==='quit')raceQuit();
  else if(a==='again'){const solo=RACE.solo;RACE.phase='idle';raceHost(solo);}});

/* =========================================================
   main loop
   ========================================================= */
let last=performance.now(),TT=0,ambT=0,halfT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(SPACE.open){ambQuiet();spaceFrame(dt);return;}
  if(gameOpen){gameTick(dt);if(GMAX){ambQuiet();return;}halfT+=dt;if(halfT<1/30)return;const d2=Math.min(.07,halfT);halfT=0;world(d2);return;}
  world(dt);
}
function ambientLantern(){
  const r=GR();let x,y,z;
  const fest=(L)=>{const a=RR(0,6.28),rr=RR(0,LS_R+1.4);x=L.x+Math.cos(a)*rr;z=L.z+Math.sin(a)*rr;y=heightAt(x,z)+.6;};
  if(r<.4){const zz=ZONES.shifen;const s=zz.s+RR(6,23);const p=RAIL.at(s);x=p.x;z=p.z;y=railY(s)+.6;}
  else if(r<.52)fest(LSPOTS.shifen);
  else if(r<.7){const p=STREET.path.at(RR(.5,STREET.path.len-.5));x=p.x;z=p.z;y=heightAt(x,z)+.6;}
  else if(r<.8)fest(LSPOTS.pingxi);
  else if(r<.93){const zz=ZONES.jingtong;const s=zz.s+RR(-2,8);const p=RAIL.at(s);x=p.x;z=p.z;y=railY(s)+.6;}
  else fest(LSPOTS.jingtong);
  return spawnLantern(x+RR(-.4,.4),y,z+RR(-.4,.4),gpick(LANTERN_COLORS).c);
}
const VO={x:0,y:0};
function updateViewOffset(dt){
  let tx=0,ty=0;const W=innerWidth,H=innerHeight;
  const panel=gameOpen&&!GMAX?$('game'):wlOpen?$('wl'):null;
  if(panel){const r=panel.getBoundingClientRect();if(panel===$('game')&&W>820)tx=-(r.left+r.width)/2;else ty=Math.max(0,H-r.top)/2;}
  if(!isFinite(tx))tx=0;if(!isFinite(ty))ty=0;
  const k=reduceMotion?1:1-Math.exp(-dt*6);VO.x=lerp(VO.x,tx,k);VO.y=lerp(VO.y,ty,k);
  if(Math.abs(VO.x)<.5&&Math.abs(VO.y)<.5&&!tx&&!ty){if(camera.view&&camera.view.enabled)camera.clearViewOffset();VO.x=VO.y=0;}
  else camera.setViewOffset(W,H,VO.x,VO.y,W,H);
}
function world(dt){
  TT+=dt;
  applyTime(dt);
  GTIME.value=TT;updateSheep(dt,TT);ambTick(dt);updateEat(dt);updateCoins(dt);updateRoute();updateCine(dt);mpUpdate(dt);raceUpdate(dt);updateAmbientTrain(dt);updateRide(dt);trainSafety(dt);updateCrossing(dt,TT);
  ambT-=dt;if(ambT<=0){ambT=(TIMEV.night>.4?2.1:4)*RR(.7,1.3);if(LANTERNS.length<38)ambientLantern();}
  updateLanterns(dt,TT);updateParticles(dt);updateFireflies(TT);updateNPCs(dt);updateNpcSay(dt);updateDogs(dt,TT);updateEgrets(dt,TT);updateBirds(dt,TT);
  for(const f of ANIM)f(dt,TT);
  for(const c of CLOUDS){c.position.x+=c.userData.v*dt;if(c.position.x>TER.x1+40)c.position.x=TER.x0-40;}
  for(const m of GMARKS){m.star.rotation.y+=dt*1.6;m.star.position.y=m.y+2.1+Math.sin(TT*2.4)*.15;const s=1+Math.sin(TT*3)*.06;m.ring.scale.set(s,s,s);}
  for(const m of LMARKS){const w=.5+.5*Math.sin(TT*2.2);const s=1+w*.05;m.ring.scale.set(s,s,s);m.ring.material.opacity=.38+.4*w;}
  if(tapMark&&tapMark.visible){tapMark.userData.t+=dt;tapMark.scale.setScalar(1+tapMark.userData.t*1.5);tapMark.material.opacity=Math.max(0,.9-tapMark.userData.t*1.5);if(tapMark.userData.t>.6)tapMark.visible=false;}
  updateZone(dt);updateCoord(dt);updateTips(dt);
  updateCamera(dt);updateViewOffset(dt);
  renderer.render(scene,camera);
  updateLabels();drawMinimap();updatePrompt();
  if(guideOpen){guideT-=dt;if(guideT<=0){guideT=.2;layoutGuide();}}
}
